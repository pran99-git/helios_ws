### Joystick teleop: /joy -> /cmd_vel.
#
# Read by teleop/teleop_joy_node.py via launch/joy_teleop.launch.py.
# The velocity ceilings here must stay at or below roboclaw.yaml's, or the
# stick goes dead over part of its travel because the driver clamps what
# teleop sends.

teleop_joy:
  ros__parameters:
    # Confirmed via `ros2 topic echo /joy` against this SN30 Pro's
    # actual pairing mode -- see README for the procedure if this changes.
    axis_vx: 1        # left stick Y (forward/back), +1.0 = forward
    axis_vy: 0        # left stick X (strafe), +1.0 = left
    axis_omega: 3     # right stick X (rotate), -1.0 = right (CW)
    invert_vx: false     # flip if pushing the stick forward drives backward
    invert_vy: false     # flip if pushing left strafes right
    invert_omega: false  # flip if pushing right rotates CCW
    deadman_button: 5  # right shoulder (R) -- must be held to move

    # Velocity at full stick deflection, in true SI units -- /cmd_vel is m/s
    # and rad/s, not a normalized [-1, 1] range. Keep these at or below
    # roboclaw_driver's ceilings below, or the stick goes dead over part of
    # its travel because the driver clamps what teleop sends.
    max_vx: 0.40       # m/s
    max_vy: 0.40       # m/s strafe
    max_omega: 0.8     # rad/s
    deadzone: 0.08       # fraction of stick travel treated as centred
    cmd_topic: 'cmd_vel'
    publish_rate: 20.0   # Hz, /cmd_vel republish rate while the deadman is held
    joy_timeout: 0.5     # s without a /joy message before commands are zeroed
