### Priority multiplexer on the way into the RoboClaw driver.
#
# Consumes:  /cmd_vel_joy        teleop_joy_node
#            /cmd_vel_smoothed   Nav2's velocity_smoother
#            /cmd_vel_lock       e-stop gate (nothing publishes it yet)
# Produces:  /cmd_vel            the only thing roboclaw_driver listens to
#
# Before this existed, teleop and Nav2 both wrote /cmd_vel and the driver acted
# on whichever arrived last, so the two had to be run one at a time. Priority
# makes the joystick an override instead of a competitor.

twist_mux:
  ros__parameters:
    # The rover's driver takes geometry_msgs/Twist, not TwistStamped.
    use_stamped: false

    topics:
      # Above the lock on purpose, so the e-stop's own zeros are NOT blocked by
      # the lock it raises. A commanded zero starts the driver's ramp at once
      # (~0.09 m from 0.40 m/s); letting the lock silence the mux instead would
      # mean waiting out cmd_timeout first (~0.28 m).
      estop:
        topic: cmd_vel_estop
        timeout: 0.5      # s
        priority: 250

      # A human reaching for the joystick outranks autonomy,
      # without having to stop the autonomy stack first.
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5      # s of silence before this input is ignored
        priority: 100

      # Nav2, and through it the VLA policy, which reaches the motors only
      # via controller_server.
      navigation:
        topic: cmd_vel_smoothed
        timeout: 0.5      # s
        priority: 10

    # A lock publishes std_msgs/Bool; true blocks every input BELOW its
    # priority. At 200 that is teleop and navigation, but not cmd_vel_estop
    # above it. Held by estop_node, and by the battery monitor when that
    # exists.
    #
    # timeout 0 means the lock never expires, so it outlives the node that
    # raised it: if estop_node dies while engaged, the rover stays blocked
    # instead of being handed straight back to whatever was driving.
    locks:
      estop:
        topic: cmd_vel_lock
        timeout: 0.0      # s, 0 means a stale lock never expires
        priority: 200
