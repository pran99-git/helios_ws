### RoboClaw driver: /cmd_vel -> both controllers, and encoder counts back out.
#
# Read by roboclaw/roboclaw_driver_node.py via launch/roboclaw_driver.launch.py.
# Geometry here MUST match perception_pkg's wheel_odometry.yaml, or commanded
# and reported velocity disagree by the same factor.

roboclaw_driver:
  ros__parameters:
    # Sole owner of both RoboClaw serial connections -- see node docstring.
    # Port names come from the udev rules in
    # perception_pkg/wheel_odometry/udev/99-roboclaw.rules.
    left_port: '/dev/roboclaw_left'
    right_port: '/dev/roboclaw_right'
    left_address: 128    # 0x80
    right_address: 128   # 0x80
    baud: 115200         # must match the rate set in Ion Studio on both controllers
    serial_timeout: 0.1  # s, per packet-serial read before the transfer is abandoned

    # Verify with a bench test (wheels off the ground) -- this write path's
    # sign convention is independent of wheel_odometry.yaml's invert_* flags.
    invert_front_left: false
    invert_front_right: false
    invert_rear_left: false
    invert_rear_right: false

    # Geometry. wheel_radius and counts_per_rev convert m/s to the counts/sec
    # the controller's velocity PID regulates, so they MUST match
    # perception_pkg/wheel_odometry/config/wheel_odometry.yaml -- if the two
    # disagree, commanded and reported velocity disagree by the same factor.
    wheelbase: 0.220          # m, front<->rear wheel center distance
    track_width: 0.330        # m, left<->right wheel center distance
    wheel_radius: 0.076       # 152 mm wheel diameter / 2
    counts_per_rev: 2448.0    # 12 PPR * 4 quadrature * 51:1 gearbox

    # Closed-loop command ceilings in SI units, NOT duty fractions. Measured
    # qpps 7590 puts the wheels at ~1.48 m/s flat out, so 0.40 m/s is ~27% of
    # the ceiling -- deliberate traction margin. Raise once scrubbing is
    # confirmed gone, and raise teleop's matching values with them.
    max_vx: 0.40       # m/s
    max_vy: 0.40       # m/s strafe
    max_omega: 0.8     # rad/s

    # Acceleration ramp, counts/sec^2, applied by the controller. At 5126
    # counts/m (2448 counts/rev over a 0.478 m circumference), 5000 is
    # ~0.98 m/s^2. This is the parameter that removes the torque step an
    # unramped duty command used to apply, so lowering it reduces slip on a
    # hard start.
    #
    # It is also the DECELERATION for every stop -- watchdog trip, deadman
    # release, shutdown. At 5000, braking from max_vx (0.40 m/s) takes
    # ~0.41 s and ~0.082 m; at 1000 it would take ~2.05 s and ~0.41 m.
    #
    # Two stop paths, with different totals:
    #   deadman released / joy goes stale -> teleop_joy keeps publishing at
    #     20 Hz with zeroed values, so braking starts within ~50 ms:
    #     ~0.09 m total.
    #   /cmd_vel stream stops outright (teleop node dies, comms drop) -> the
    #     watchdog waits up to cmd_timeout (0.5 s) at full speed first:
    #     ~0.20 m coasting + ~0.082 m braking = ~0.28 m total.
    #
    # Trade traction against stopping distance deliberately, and recompute
    # these numbers whenever max_vx or drive_accel changes.
    drive_accel: 5000         # counts/sec^2

    cmd_topic: 'cmd_vel'
    cmd_timeout: 0.5   # s; ramped stop if /cmd_vel goes stale
    control_rate: 20.0 # Hz, rate commands are pushed to the controllers

    # Encoder read/publish path -- consumed by perception_pkg's
    # wheel_odometry_node (see its encoder_topic param, must match).
    encoder_topic: 'roboclaw/wheel_encoders'
    encoder_publish_rate: 30.0   # Hz, sets wheel_odometry's effective update rate
