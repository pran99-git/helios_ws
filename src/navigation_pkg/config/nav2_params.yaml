### Nav2 for the Helios A4WD3 mecanum rover.
#
# Consumes:  /map                 from mapping_localization_pkg (slam_toolbox,
#                                 rtabmap, or amcl over a saved map)
#            /odometry/filtered   from perception_pkg's EKF
#            /scan                from the Hokuyo UST-10LX, frame 'laser'
# Produces:  /cmd_vel_smoothed    into twist_mux, which owns /cmd_vel
#
# TF ownership: the EKF owns odom -> base_link, whichever mapper is
# running owns map -> odom. Nav2 publishes NO transforms.
#
# The rover is holonomic, so the MPPI motion model is "Omni". Strafe is kept as
# a fine-correction axis only (low vy_max): the rover drives nose-first, facing
# where it is going. Raise vy_max/vy_std to restore full omnidirectional motion.
#
# Geometry below is derived from helios_description/urdf/base.xacro. If the
# rover is re-measured, update it there first and mirror the change here.

# ---------------------------------------------------------------- controller ---
controller_server:
  ros__parameters:
    controller_frequency: 20.0        # Hz, matches roboclaw_driver's control_rate
    min_x_velocity_threshold: 0.001   # m/s, below this the axis reads as stopped
    min_y_velocity_threshold: 0.001   # m/s
    min_theta_velocity_threshold: 0.001  # rad/s
    failure_tolerance: 0.3            # s of no progress before the controller fails
    odom_topic: /odometry/filtered    # the EKF output, NOT /wheel/odometry
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # Must accept ROTATION as progress. FollowPath rotates in place to align
      # before driving, which SimpleProgressChecker reads as a stall: it aborts,
      # and the behavior tree's recovery (Spin, BackUp) then fights the align.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5   # m of translation that counts as progress
      required_movement_angle: 0.5    # rad of rotation that counts as progress
      movement_time_allowance: 15.0   # s to achieve either of the above

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15         # m, roughly half the rover's width
      yaw_goal_tolerance: 0.20        # rad (~11.5 deg)
      stateful: true                  # once xy is met, only yaw must still converge

    FollowPath:
      # RotationShimController wraps MPPI and owns pure rotation. MPPI averages
      # its sampled trajectories into one command, so it can only ever blend
      # "turn" and "drive" into an arc. The shim switches between them instead:
      #   heading error > angular_dist_threshold -> rotate in place, MPPI idle
      #   heading error < angular_dist_threshold -> hand off to MPPI and drive
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      angular_dist_threshold: 0.50      # rad (~29 deg), align-first above this
      forward_sampling_distance: 0.50   # m along the path to take heading from
      rotate_to_heading_angular_vel: 0.80  # rad/s, matches wz_max
      max_angular_accel: 1.50           # rad/s^2, inside velocity_smoother's 2.0
      simulate_ahead_time: 1.0          # s of collision checking before rotating
      rotate_to_goal_heading: true      # final yaw is a pivot, not an arc

      # --------------------------- primary controller: MPPI ------------------

      # MPPI rolls out batch_size candidate trajectories, each time_steps long at
      # model_dt seconds per step, scores them with the critics below, and takes a
      # softmax-weighted average. Horizon = time_steps * model_dt = 2.0 s.
      #
      # batch_size and time_steps are REDUCED from the upstream defaults
      # (2000 / 56) because this Jetson already runs the ZED at ~155% CPU. Raise
      # them toward the defaults if headroom allows; lower them if the controller
      # misses its 20 Hz rate. Cost scales with batch_size * time_steps.
      time_steps: 40                  # steps per rollout
      model_dt: 0.05                  # s per step; 1/controller_frequency
      batch_size: 1000                # candidate trajectories per cycle
      iteration_count: 1              # optimizer passes per cycle

      # Sampling spread, per axis. Too small and the optimizer cannot find its way
      # around obstacles; too large and the command is noisy.
      vx_std: 0.20                    # m/s
      # Strafe is a correction axis, not a travel axis: matching vx here makes a
      # sideways slide cost no more than driving forward, and the rover crabs.
      vy_std: 0.05                    # m/s
      wz_std: 0.40                    # rad/s

      # Ceilings, matching low_level_control_pkg/config/roboclaw.yaml. Keeping
      # these at or below the driver's own limits means the driver never clamps a
      # command Nav2 believed it had issued.
      vx_max: 0.40                    # m/s forward
      # A limit, not a critic weight: reverse is for extraction, never travel,
      # and a limit cannot be outvoted by the other critics.
      vx_min: -0.15                   # m/s reverse
      vy_max: 0.10                    # m/s strafe, fine correction only
      wz_max: 0.80                    # rad/s

      # Acceleration limits. Left unset MPPI defaults to ~3 m/s^2 and can demand
      # a near-instant stop. ax_min shapes the braking ramp into the goal:
      # 0.40 m/s to rest over ~0.67 s and ~0.13 m.
      ax_max: 0.60                    # m/s^2
      ax_min: -0.60                   # m/s^2, the braking ramp into the goal
      ay_max: 0.30                    # m/s^2
      az_max: 1.50                    # rad/s^2

      temperature: 0.3                # softmax sharpness; lower = greedier
      gamma: 0.015                    # control-cost weight, penalises large commands
      motion_model: "Omni"            # MECANUM. "DiffDrive" would forbid vy.
      visualize: false                # publishing candidate trajectories costs CPU
      prune_distance: 1.7             # m of path considered ahead of the robot
      transform_tolerance: 0.1        # s

      # These weights trade heading against progress and must be changed as a
      # set. Heading (PreferForward + PathAngle + GoalAngle) too far above
      # progress (PathAlign + PathFollow) and the optimizer holds still rather
      # than lose alignment; too far below and the rover crabs sideways.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic","TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0              # penalty for exceeding the velocity limits
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0            # penalty for driving into costmap cost
        near_collision_cost: 253
        critical_cost: 300.0          # cost treated as effectively lethal
        consider_footprint: true     # true is exact but much slower; see README
        collision_cost: 1000000.0
        near_goal_distance: 1.0       # m, relaxes obstacle cost near the goal
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0              # pull toward the goal position
        # Early enough to brake before overshooting, late enough that it does
        # not dominate the whole of a short goal.
        threshold_to_consider: 1.5    # m from goal before this activates
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Low and late: rotate_to_goal_heading gives the shim the final heading,
        # so this only has to stop MPPI drifting off it on the approach.
        cost_weight: 3.0              # pull toward the goal heading
        threshold_to_consider: 0.5    # m from goal before heading matters
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0             # stay ON the planned path
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5    # m from goal after which path following stops
        offset_from_furthest: 20
        # SmacPlanner2D emits 8-connected grid paths whose orientations quantise
        # to 45 deg steps; chasing those makes the rover hunt on tight turns.
        # PathAngleCritic handles heading instead.
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Must outweigh the heading critics, or the cheapest trajectory the
        # optimizer can find is to sit still and stay aligned.
        cost_weight: 12.0             # progress ALONG the path
        offset_from_furthest: 15
        threshold_to_consider: 1.5    # m
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Penalises heading error against the path ahead, so a large error makes
        # turning on the spot cheaper than driving, a small one becomes a curve.
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5     # m
        max_angle_to_furthest: 0.30    # rad (~17 deg) before heading is penalised
        mode: 0                       # forward preference: drive nose-first
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Penalises reverse travel, so a goal behind the rover is reached by
        # turning to face it rather than backing toward it. Pushed much higher
        # it overwhelms the progress critics and the optimizer stalls.
        cost_weight: 16.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # The shim bypasses MPPI while pivoting, so this does not fight a
        # deliberate turn: it only stops MPPI spinning once it has control.
        cost_weight: 8.0              # penalise spinning that does not serve the path

# ------------------------------------------------------------------- planner ---
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0   # Hz, replan rate driven by the behavior tree
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.20                 # m, accept a plan ending this close to the goal
      downsample_costmap: false       # 5 cm cells are already coarse enough
      downsampling_factor: 1
      allow_unknown: true             # plan through unmapped space; SLAM fills it in
      max_iterations: 1000000
      max_planning_time: 2.0          # s before the plan attempt is abandoned
      cost_travel_multiplier: 2.0     # >1 biases paths away from obstacles
      use_final_approach_orientation: false  # omni: MPPI handles the final heading

# ------------------------------------------------------------------ behaviors ---
behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1          # s
    cycle_frequency: 10.0             # Hz
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0          # s of motion checked for collisions first
    max_rotational_vel: 0.8           # rad/s, matches the drive ceiling
    min_rotational_vel: 0.2           # rad/s
    rotational_acc_lim: 2.0           # rad/s^2

# --------------------------------------------------------------- bt_navigator ---
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10              # ms per behavior-tree tick
    default_server_timeout: 20        # ms
    wait_for_service_timeout: 1000    # ms
    # Which action error codes the tree propagates upward. Without this the
    # server logs "Error_code parameters were not set" and falls back to these
    # same two, so setting them explicitly only silences the warning.
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    # default_nav_to_pose_bt_xml is left unset on purpose: the default
    # (navigate_to_pose_w_replanning_and_recovery.xml) is what we want, and
    # hardcoding a path into nav2_bt_navigator's share dir breaks on upgrade.

# ----------------------------------------------------------- velocity smoother ---
# controller -> /cmd_vel_nav -> smoother -> /cmd_vel_smoothed, remapped in
# navigation.launch.py. twist_mux (started with the driver) is what forwards
# it to /cmd_vel, and the joystick outranks it there.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0         # Hz, matches controller_frequency
    scale_velocities: false           # keep the commanded direction; do not rescale
    feedback: "OPEN_LOOP"             # trust the last command, do not read odometry
    max_velocity: [0.40, 0.40, 0.80]  # [vx m/s, vy m/s, wz rad/s]
    min_velocity: [-0.35, -0.40, -0.80]
    # Acceleration ceilings. roboclaw.yaml's drive_accel of 5000 counts/sec^2 is
    # ~0.98 m/s^2 at 5126 counts/m, so 0.8 stays inside what the controller can
    # actually deliver and the ramp is never fighting the firmware's own.
    max_accel: [0.80, 0.80, 2.00]     # [m/s^2, m/s^2, rad/s^2]
    # Softer than max_accel on purpose: the controller steps straight to zero
    # when the goal checker passes, so this ceiling alone decides how hard the
    # arrival feels. The e-stop bypasses this smoother (twist_mux priority 250),
    # so emergency stopping distance is unaffected.
    max_decel: [-0.50, -0.50, -1.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.1                # s of odometry history used when CLOSED_LOOP
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0             # s without a command before zeroing output

# -------------------------------------------------------------- global costmap ---
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0           # Hz
      publish_frequency: 1.0          # Hz
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05                # m/cell, matches slam_toolbox's map resolution
      track_unknown_space: true
      # Rectangular footprint, not robot_radius: this base is 0.38 x 0.38 at the
      # wheel extremities (wheels reach x=+-0.186 and y=+-0.1875 in base.xacro)
      # and a circumscribing circle would refuse gaps it actually fits through.
      footprint: "[[0.19, 0.19], [0.19, -0.19], [-0.19, -0.19], [-0.19, 0.19]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # latched /map from the mapper
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser         # matches urg_node2.yaml's frame_id
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0    # m
          obstacle_max_range: 8.0     # m, inside the UST-10LX's 10 m so returns are trusted
          obstacle_min_range: 0.05    # m
          raytrace_max_range: 9.0     # m, clears slightly beyond what it marks
          raytrace_min_range: 0.05    # m
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45        # m, ~1.7x the 0.27 m circumscribed radius
        # Must decay to near-zero by inflation_radius. At 3.0 the exponential is
        # still at ~116 when it is truncated, leaving a cost cliff that flips
        # MPPI's chosen trajectory between cycles, and a high plateau with no
        # gradient in corridors under ~1.3 m wide.
        cost_scaling_factor: 12.0     # higher = cost falls off faster with distance

# --------------------------------------------------------------- local costmap ---
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0           # Hz
      publish_frequency: 2.0          # Hz
      # Publish the whole grid every cycle, not just the first one. Nav2's
      # default sends the full costmap once and only incremental updates after,
      # so any node subscribing later (amcl_recovery, a debug tool) receives
      # nothing at all and waits forever. 80x80 cells at 2 Hz is ~13 kB/s.
      # Read at configure time, so changing it needs a relaunch, not a param set.
      always_send_full_costmap: true
      global_frame: odom              # odom, not map: the local window must not jump
      robot_base_frame: base_link
      rolling_window: true
      width: 4                        # m
      height: 4                       # m
      resolution: 0.05                # m/cell
      footprint: "[[0.19, 0.19], [0.19, -0.19], [-0.19, -0.19], [-0.19, 0.19]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Two sources at different heights. The laser sweeps 270 deg but only at
        # 0.176 m, so anything shorter is invisible to it and the rover drives
        # into it. The ZED sits LOWER (0.126 m) and sees a ~110 deg forward
        # wedge in 3D, which is what catches low obstacles ahead.
        #
        # Heights below are z in the costmap's global_frame (odom). The EKF runs
        # two_d_mode, so odom z = 0 is exactly the base_link plane, and
        # base_link sits at wheel-axle height (wheel_radius 0.076 m). Therefore:
        #     real ground        z = -0.076
        #     ZED optical centre z = +0.050
        #     laser plane        z = +0.100
        observation_sources: scan zed_cloud
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0    # m
          obstacle_max_range: 6.0     # m, shorter than global: only the local window matters
          obstacle_min_range: 0.05    # m
          raytrace_max_range: 7.0     # m
          raytrace_min_range: 0.05    # m
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          # sensor_frame deliberately blank: taken from the cloud header, which
          # is also the ray origin used for clearing. Hardcoding it wrong makes
          # the rays start in the wrong place and clear the wrong cells.
          data_type: "PointCloud2"
          clearing: true
          marking: true
          # TUNE THIS FIRST if the rover either walls itself in or still hits
          # low objects. -0.040 is 36 mm above the real floor, so obstacles
          # taller than ~4 cm mark and the floor itself does not. Raise it
          # (towards 0) if stereo noise starts marking the floor; lower it
          # (towards -0.076) to catch flatter objects, at that risk.
          min_obstacle_height: -0.040  # m, = 36 mm above the floor
          max_obstacle_height: 0.50    # m, well past the laser plane: catches
                                       # tabletops and overhangs the laser misses
          # Much shorter than the laser's 6 m. Stereo depth error grows with the
          # square of range, and beyond ~2.5 m the noise would mark phantom
          # obstacles faster than raytracing clears them.
          obstacle_max_range: 2.5     # m
          obstacle_min_range: 0.25    # m, the ZED cannot resolve depth closer
          raytrace_max_range: 3.0     # m, clears slightly beyond what it marks
          raytrace_min_range: 0.25    # m
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45        # m
        cost_scaling_factor: 12.0     # see the global costmap note above
