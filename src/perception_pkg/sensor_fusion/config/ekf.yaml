### robot_localization EKF: local odometry (odom -> base_link)
#
# Fuses WHEEL odometry with the ZED 2i VISUAL-INERTIAL odometry.
#
# Why no separate IMU input: the ZED /odom is already a visual-INERTIAL estimate
# (the SDK fuses the camera AND the IMU internally). Feeding /zed/.../imu/data
# here as well would count the IMU twice. The camera and IMU enter together
# through odom1, and the raw IMU block stays disabled below.
#
# This node is the SOLE publisher of odom -> base_link. The wheel_odometry node
# and the ZED wrapper must have their own TF publishing turned OFF (handled in
# the launch files).

ekf_filter_node:
  ros__parameters:
    frequency: 30.0             # Hz, filter output and TF publish rate
    sensor_timeout: 0.2         # s, without a measurement the filter predicts only
    transform_time_offset: 0.02  # s, future-dating of the published TF

    # --- Lagged measurement handling ----------------------------------------
    # The two inputs do NOT arrive with the same delay. Measured live, header
    # stamp vs arrival:
    #
    #     /wheel/odometry        median   1.6 ms
    #     /zed/odom_with_cov     median  58.1 ms   p90 69 ms   max 315 ms
    #
    # That is ~1.7 filter cycles of skew. Without smooth_lagged_data the ZED
    # measurement arrives after the filter has already advanced past its own
    # timestamp, so it is folded in with a clamped (zero) time delta instead of
    # at the instant it describes. With it, the filter rewinds to the
    # measurement's timestamp, applies it there, and re-integrates forward.
    #
    # This is the leading HYPOTHESIS for a measured discrepancy, not a proven
    # fix. Solving  ekf = a*wheel + (1-a)*zed  on integrated yaw over a 99.7 s
    # spin gave a = 0.33, i.e. the wheels carried a THIRD of the fused yaw. The
    # covariances below (0.5 vs 0.01) specify a = 0.02. So the ZED is being
    # under-weighted ~16x and this skew is the most likely reason. The other
    # candidate is odom1_twist_rejection_threshold, relaxed below.
    #
    # history_length must cover the lag being compensated. 0.3 s clears the
    # measured p90 by 4x with headroom for the outliers; it is deliberately not
    # larger, because every lagged measurement re-integrates the whole window
    # and this node has already logged "failed to meet update rate" under load.
    smooth_lagged_data: true
    history_length: 0.3         # s, rewind window for late measurements
    two_d_mode: true            # flat ground + 2D LiDAR -> zero z, roll, pitch
    publish_tf: true            # owns odom -> base_link
    publish_acceleration: false

    map_frame: map              # unused here; world_frame below selects odom
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # local EKF: output is odom -> base_link

    # Config vector order (15):
    #   x,  y,  z,
    #   roll, pitch, yaw,
    #   vx, vy, vz,
    #   vroll, vpitch, vyaw,
    #   ax, ay, az

    # --- Wheel odometry (mecanum) : fuse body velocities only --------------
    # Never fuse its absolute x/y/yaw (those drift); velocities are what's good.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false   # velocities are already differential; do not re-difference
    odom0_relative: false       # do not zero the first measurement as an origin
    odom0_queue_size: 10        # messages buffered per filter cycle
    odom0_nodelay: true         # TCP_NODELAY on the subscription, lower arrival jitter

    # --- ZED 2i visual-inertial odometry (camera + IMU) --------------------
    # Fuse body velocities. This is how BOTH the camera and the IMU enter the
    # filter without double-counting.
    #
    # NOT the wrapper's raw /zed/zed_node/odom. That topic carries an all-zero
    # twist.covariance (the wrapper never assigns it and has no parameter to),
    # and since only the twist is fused here, robot_localization substituted
    # 1e-9 and gave the ZED a Kalman gain of exactly 1.0 -- overwriting the
    # wheel odometry instead of blending with it, while its Mahalanobis gate
    # rejected ~20% of measurements outright. custom_covariance's
    # zed_odom_covariance_node republishes the same data with a real covariance
    # from its own YAML. Measurement covariance can ONLY arrive on the message:
    # robot_localization has no per-input covariance parameter.
    #
    # This node MUST be running or odom1 is silent. sensor_fusion's
    # bringup.launch.py starts it alongside the camera.
    odom1: /zed/odom_with_cov
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false   # velocities are already differential; do not re-difference
    odom1_relative: false       # do not zero the first measurement as an origin
    odom1_queue_size: 10        # messages buffered per filter cycle
    odom1_nodelay: true         # TCP_NODELAY on the subscription, lower arrival jitter
    # Provisional. This gate computes a Mahalanobis distance using the measurement
    # covariance. With vyaw variance 0.01 (sigma 0.1 rad/s), a threshold of 2.0
    # rejects any ZED yaw rate differing from the filter's prediction by more
    # than 0.2 rad/s = 11.5 deg/s. That is not a large margin on a rover that
    # spins at 20-48 deg/s: the 58 ms arrival skew documented at the top of this
    # file turns into exactly this kind of transient disagreement whenever
    # angular acceleration is high, i.e. at the start and end of every turn.
    #
    # Rejecting the ZED there is backwards. Measured against a de-biased gyro
    # over a 99.7 s spin, the ZED twist was the single most accurate yaw source
    # on the robot (+0.03%), while the wheels read -3.3% low. It is the source
    # that should survive the gate.
    #
    # 5.0 -> rejects beyond 0.5 rad/s = 28.6 deg/s of disagreement: permissive
    # enough for normal turning transients, still tight enough to catch a gross
    # VIO failure. STILL NOT MEASURED: the right way to set this is from the
    # observed innovation distribution on a moving run. Do that and replace
    # this number; note that odom0 (wheels) has no gate at all, so a bad
    # encoder spike -- one 10987 deg/s sample was recorded -- enters unfiltered.
    odom1_twist_rejection_threshold: 5.0

    # --- RAW IMU : intentionally DISABLED (anti-double-count) --------------
    # Only enable this if you turn OFF the ZED's internal IMU fusion (i.e. make
    # /zed/.../odom purely visual). Then the IMU becomes an independent source.
    # imu0: /zed/zed_node/imu/data
    # imu0_config: [false, false, false,
    #               false, false, true,
    #               false, false, false,
    #               false, false, true,
    #               true,  false, false]
    # imu0_differential: false
    # imu0_relative: false
    # imu0_queue_size: 10
    # imu0_remove_gravitational_acceleration: true

    # Leaving process/initial covariances at robot_localization defaults for the
    # initial bring-up. Tune process_noise_covariance after seeing live behavior.
