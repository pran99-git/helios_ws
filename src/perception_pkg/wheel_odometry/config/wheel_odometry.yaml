wheel_odometry:
  ros__parameters:
    # === Lynxmotion A4WD3 Mecanum rover ======================================

    # --- Encoder source --------------------------------------------------------
    # Raw per-wheel encoder counts (sensor_msgs/JointState), published by
    # low_level_control_pkg's roboclaw_driver_node -- that node owns the actual
    # RoboClaw serial connection; this node only consumes its topic. See
    # low_level_control_pkg/config for the serial port/baud/address params.
    encoder_topic: 'roboclaw/wheel_encoders'

    # --- Wheel sign inversion ------------------------------------------------
    # Fixed wiring (hardcoded in the node):
    #   LEFT  controller (ACM0): front_left = M2, rear_left = M1
    #   RIGHT controller (ACM1): front_right = M1, rear_right = M2
    # Flip a flag if that wheel reads negative when driven forward.
    # On this rover all four already read positive forward -> all false.
    invert_front_left: false
    invert_front_right: false
    invert_rear_left: false
    invert_rear_right: false

    # --- Geometry / encoders -------------------------------------------------
    wheel_radius: 0.076          # 152 mm mecanum wheel diameter / 2

    wheelbase: 0.220             # front<->rear wheel center distance (m)
    track_width: 0.330           # left<->right wheel center distance (m)

    # Counts per WHEEL revolution = encoder_PPR(12) * 4(quadrature) * gear_ratio.
    #   This rover: 51:1 gearbox -> 12 * 4 * 51 = 2448.
    counts_per_rev: 2448.0

    # --- Yaw scale calibration (2026-08-26) ----------------------------------
    # Multiplies the dtheta term ONLY. 1.0 = the pure geometric model.
    #
    # The geometric model divides by 4*L with L = (wheelbase+track_width)/2 =
    # 0.275 m. Mecanum rollers slip laterally during rotation, so the EFFECTIVE
    # lever arm is SHORTER than the geometric one and the model under-reports
    # yaw. (Shorter, not longer: dtheta is inversely proportional to L, so an
    # under-report means the true L is smaller.)
    #
    # Measured in-place, three separate spin windows, against the ZED gyro
    # de-biased by its own measured -0.1355 deg/s stationary bias:
    #
    #     window    duration   wheel/truth
    #     seg8         25.4s      0.9687
    #     seg9         66.1s      0.9702
    #     spin2        99.7s      0.9670
    #                             ------
    #                     mean    0.9686   (spread +/-0.0016)
    #
    # yaw_scale = 1/0.9686 = 1.032. Implied effective lever arm 0.275*0.9686 =
    # 0.2664 m. Over the 1335 deg spin that removed a 44 deg yaw error.
    #
    # CAVEATS, read before trusting this on a long run:
    #  * Calibrated during PURE IN-PLACE ROTATION. Roller slip during combined
    #    translation+rotation may differ, so this is one scalar standing in for
    #    what is really a motion-dependent effect.
    #  * The reference is the ZED's own gyro, de-biased over a 42.9 s stationary
    #    stretch. It is not an external truth. Now that slam_toolbox actually
    #    processes rotation (its minimum_travel_distance was the reason it did
    #    not), map->odom is a better, independent reference -- re-check this
    #    number against it and correct if they disagree.
    #  * Set back to 1.0 to disable, without touching the geometry above.
    yaw_scale: 1.032

    # --- ROS interface -------------------------------------------------------
    # No publish_rate here -- odometry is published once per encoder message
    # received; the rate is set by roboclaw_driver_node's encoder_publish_rate.
    odom_frame_id: 'odom'
    base_frame_id: 'base_link'
    odom_topic: 'wheel/odometry'
    publish_tf: true

    # Covariance diagonals: [x, y, z, roll, pitch, yaw].
    #
    # y is observable (mecanum can strafe) but it is NOT as trustworthy as x.
    # Lateral motion is produced entirely by the free rollers, with no
    # body-level feedback -- the per-wheel velocity PID regulates each wheel
    # to its setpoint and cannot tell that the body went sideways instead of
    # straight. Ground tests confirmed the rover tracks well forward/back and
    # in yaw, and drifts off-axis only when strafing. So y gets a variance 5x
    # x's, which is what tells the EKF to lean on the ZED VIO for lateral
    # velocity while still trusting the wheels longitudinally.
    #
    # Raise the y term further if strafing still pulls the fused estimate;
    # lower it back toward x only after the strafe drift is mechanically
    # fixed.
    pose_covariance_diagonal: [0.01, 0.05, 1.0e+6, 1.0e+6, 1.0e+6, 0.05]
    # vyaw (last entry) RAISED 0.05 -> 0.5 on 2026-08-25. ekf.yaml fuses
    # vyaw from BOTH this and the ZED (/zed/odom_with_cov, variance 0.01), so
    # at 0.05 the wheels carried 1/6 of the fused yaw estimate. On a MECANUM
    # base that is the worst possible yaw source: yaw comes from encoder
    # differences over a geometric lever arm of (wheelbase+track_width)/2 =
    # 0.275 m, and the rollers slip laterally, so the effective lever arm is
    # not the geometric one. The resulting error is a SCALE BIAS, which does
    # not average out -- it integrates.
    #
    # Measured on rtabmap_20260825_150118.db: over a 16.8 m loop with 1311 deg
    # of total rotation, the fused odometry accumulated 37 deg of yaw error
    # (~2.8%). Ground truth from LiDAR scan alignment between the first and
    # returning node: +2.0 deg, 5 cm. That 37 deg is what twisted the map.
    #
    # 0.5 moves the ZED:wheel yaw weighting from 5:1 to 50:1 -- VIO owns yaw,
    # the wheels stay as a graceful fallback if the camera drops out. This is
    # mitigation, not a cure: the real fix is to calibrate the effective yaw
    # lever arm (spin the rover a known number of turns in place and compare
    # /wheel/odometry against /zed/zed_node/odom and the LiDAR).
    #
    # Only the TWIST entry matters here: ekf.yaml fuses indices 6,7,11
    # (vx, vy, vyaw), all velocities, so pose_covariance_diagonal is unused.
    twist_covariance_diagonal: [0.01, 0.05, 1.0e+6, 1.0e+6, 1.0e+6, 0.5]
