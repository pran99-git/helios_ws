# config/zed_overrides.yaml
#
# Our departures from Stereolabs' shipped ZED 2i defaults.
#
# Loaded by sensor_fusion/launch/bringup.launch.py via the wrapper's
# `ros_params_override_path` argument. The wrapper stacks parameter sources in
# this order (zed_camera.launch.py:415-451), later winning:
#
#   1. common_stereo.yaml            submodule, vendor
#   2. zed2i.yaml                    submodule, vendor
#   3. object detection YAMLs        submodule, vendor
#   4. THIS FILE
#   5. the launch-argument dict      <-- still beats us
#   6. inline `param_overrides:=`    highest
#
# Step 5 matters: `pos_tracking.publish_tf`, `pos_tracking.publish_map_tf`,
# `general.camera_model`, `general.camera_name`, `general.serial_number` and
# `sensors.publish_imu_tf` are set from launch arguments AFTER this file is
# read, so putting them here does nothing. Set those as launch arguments.
#
# ONLY list values we actually change. Copying a vendor default in "for
# reference" silently pins it, so a future submodule bump that improves the
# default gets shadowed by a stale number nobody remembers typing.
---
/**:
    ros__parameters:
        general:
            # The Jetson runs out of compute before it runs out of camera.
            # Depth is recomputed on EVERY grab, and depth_mode is
            # NEURAL_LIGHT, which measured ~155% CPU in zed_container on its
            # own -- enough to starve the EKF and stall the odom->base_link TF
            # past RTAB-Map's 0.5 s wait_for_transform budget (that is the
            # documented root cause of the dropped RGB-D frames; see the
            # rtabmap README).
            #
            # grab_frame_rate stays at the vendor's 60 deliberately. It is the
            # SENSOR capture rate, and a high capture rate is what keeps
            # exposure short, which is what keeps motion blur out of the images
            # the VIO tracks features in. Halving it to 30 would cut compute,
            # but it would pay for that in blur during turns -- the wrong
            # trade for a rover whose whole problem is scan/visual matching
            # while rotating.
            #
            # grab_compute_capping_fps is the surgical version of that cut: it
            # caps how often the SDK *processes* a grab (it goes straight into
            # sl::InitParameters, zed_camera_component_main.cpp:2788) while the
            # sensor keeps capturing at 60. Short exposure, half the depth
            # compute. 0.0 (vendor default) means no cap.
            #
            # KNOWN SIDE EFFECT, verify this live: positional tracking runs off
            # processed grabs, so /zed/zed_node/odom drops from the ~50 Hz
            # measured at the vendor defaults to roughly this number. The EKF
            # runs at 30 Hz (ekf.yaml) with sensor_timeout 0.2, so 30 still
            # clears it -- but the margin is now one sample, not two. If the
            # EKF starts logging "failed to meet update rate", raise this to
            # 40 before touching anything else.
            grab_compute_capping_fps: 30.0

            # Publish rate for images and the depth map. 0.0 (vendor default)
            # means "no limit", i.e. publish at the grab rate -- so at the
            # vendor defaults the wrapper was serialising 60 full-resolution
            # image + depth pairs per second.
            #
            # Set by PAIRING, not by throughput. Around 12% of depth frames
            # have no RGB frame at the same stamp. RTAB-Map's approximate-time
            # sync pairs those with the nearest surviving RGB frame, and the
            # geometric error that causes is yaw_rate x skew, where skew is one
            # PUBLISH PERIOD. Throttling does not make the drops rarer, it
            # stretches each one: the rate the consumer needs is whatever keeps
            # the skew small, not the 1 Hz keyframe rate.
            #
            # rtabmap.launch.py bounds this with rgbd_sync +
            # approx_sync_max_interval 0.02, which DROPS mismatched sets. This
            # value then governs how many clean frames survive that filter: at
            # 30 Hz minus ~12% there is comfortable headroom over the 1 Hz
            # keyframe rate, where 10 Hz minus 12% left the RGB-D stream as the
            # narrowest input in a 3-way sync against a 40 Hz scan.
            #
            # Keep this EQUAL to grab_compute_capping_fps above. Publishing
            # faster than the SDK processes buys nothing, and processing faster
            # than we publish wastes the compute. If CPU becomes the binding
            # constraint, lower BOTH together -- do not reopen a gap between
            # them, which is exactly the mistake this note replaces.
            #
            # NOTE this does NOT reduce depth *computation* -- that is what
            # grab_compute_capping_fps above does. This only reduces the
            # serialise-and-publish cost, which is CPU on both ends.
            pub_frame_rate: 30.0

        depth:
            # Publish depth as 16UC1 millimetres instead of 32FC1 metres.
            #
            # rtabmap.launch.py sets Mem/SaveDepth16Format=true so depth is
            # stored with RVL instead of falling back to PNG (2.40 -> 0.79
            # MB/node measured). With 32-bit float input RTAB-Map has to
            # convert every frame first and says so:
            #   "depth type detected is 32FC1, use 16UC1 depth format to avoid
            #    this conversion"
            # plus a per-frame "N depth values ignored because they are over
            # the maximum depth allowed (65535 mm)" for the handful of
            # infinite-depth pixels. Publishing 16UC1 directly makes the stored
            # format native and both warnings go away.
            #
            # Cost: 1 mm quantisation and a 65.535 m ceiling. Irrelevant on a
            # 0.120 m stereo baseline, where depth is already meaningless past
            # ~15 m and the export is clipped at 4 m anyway.
            openni_depth_mode: true

            # The local costmap now subscribes to point_cloud/cloud_registered
            # as a second obstacle source, to see the low objects the laser
            # plane at 0.176 m misses entirely. See navigation_pkg's
            # nav2_params.yaml obstacle_layer.
            #
            # That subscription is what MAKES the cloud: publish_point_cloud
            # only advertises, and the SDK computes nothing until someone
            # subscribes. So this stopped being free the moment the costmap
            # asked for it, on a Jetson whose ZED contention is already the
            # documented cause of the RTAB-Map frame drops.
            #
            # REDUCED is half resolution. The costmap bins everything into
            # 0.05 m cells, so full resolution buys nothing and costs GPU.
            point_cloud_res: 'REDUCED'
            # 2x the local costmap's 5 Hz update. Faster only ages out marks
            # sooner than the costmap can use them.
            point_cloud_freq: 10.0        # Hz

# ---------------------------------------------------------------------------
# Deliberately left at vendor defaults. Recorded so re-opening one of these is
# a decision rather than a discovery.
#
#   depth.depth_mode: 'NEURAL_LIGHT'
#       The largest GPU consumer on the robot. A classical stereo mode would
#       save more than everything above combined but costs depth accuracy,
#       which is the point of running RTAB-Map. Try grab_compute_capping_fps
#       first.
#
#   depth.depth_confidence: 95 / depth.depth_texture_conf: 100
#       Do NOT tighten these to clean up the cloud. The same depth map feeds
#       both the 3D cloud and SLAM geometry, and PnP verification needs depth
#       AT the keypoints: tightening them cuts visual loop closures roughly 5x
#       and produces "Not enough inliers" registration failures. Clean the
#       cloud at export time instead (cloud_max_depth, voxel and noise
#       filtering in rtabmap-databaseViewer).
#
#   pos_tracking.area_memory: true
#       ZED-internal loop closure. Its relocalisations snap the POSE on
#       /zed/zed_node/odom by tens of degrees within a single frame, but
#       ekf.yaml fuses indices 6, 7, 11 (vx, vy, vyaw) only, and the twist
#       stays clean through those jumps. Safe as long as nothing consumes ZED
#       pose. It stops being safe the moment pose indices are added to
#       odom1_config, the wrapper's publish_tf is enabled, or RTAB-Map's
#       odom_topic is pointed at /zed/zed_node/odom.
#
#   mapping.mapping_enabled: false / object_detection.od_enabled: false
#       Separate GPU workloads. Leave off until something consumes their output.
#
#   video.auto_exposure_time_range_max: 30000 (vendor default)
#       Capping the auto-exposure ceiling would reduce motion blur: at HD720
#       the ZED 2i spreads ~1280 px over ~104 deg, so a 30 ms exposure at
#       45 deg/s smears ~17 px against RTAB-Map's 2 px Vis/PnPReprojError
#       budget. Untested here. If evaluated, change it ALONE and check
#       features/node in the resulting database, since a darker image costs
#       features to gain sharpness. Try 15000 before 8000.
# ---------------------------------------------------------------------------
