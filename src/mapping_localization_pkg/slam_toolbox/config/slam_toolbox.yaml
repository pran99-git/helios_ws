### slam_toolbox (online async) — LiDAR mapping, publishes map -> odom
#
# Consumes /scan (Hokuyo UST-10LX, frame 'laser') and the EKF's odom -> base_link,
# and produces the map plus the map -> odom correction. This is how the LiDAR
# enters the fusion (REP-105: SLAM owns map -> odom; EKF owns odom -> base_link).

slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames / topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping                 # 'mapping' to build a map; 'localization' to reuse one

    # Rates / TF
    transform_publish_period: 0.02
    map_update_interval: 2.0
    transform_timeout: 0.5
    scan_queue_size: 20
    tf_buffer_duration: 10.0
    use_scan_matching: true
    use_scan_barycenter: true

    # Hokuyo UST-10LX: ~270 deg FOV, 10 m range
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    resolution: 0.05

    # LOWERED 0.2 -> 0.05 on 2026-08-26. At 0.2 this node processed ZERO scans
    # during in-place rotation and the map silently stopped updating.
    #
    # slam_toolbox's own pre-filter (shouldProcessScan) gates on TRANSLATION
    # only. minimum_travel_heading below is consulted by the karto mapper, which
    # sits DOWNSTREAM of that gate -- so a scan taken while the rover spins on
    # the spot is discarded before anything ever looks at the heading. Rotating
    # in place produces no translation, so no scan is ever processed.
    #
    # This is invisible from outside: the node stays lifecycle-'active',
    # answers parameter queries, keeps publishing /map on its map_update_interval
    # timer and map->odom on its transform_publish_period timer, and logs
    # nothing. What gives it away is that map->odom is bit-exactly identity and
    # /pose never publishes.
    #
    # Measured A/B, same rover, same in-place spin (odom translation stayed
    # under 3.5 cm throughout):
    #   0.2   -> 0 scans processed over ~1443 deg, graph 1 node / 0 edges,
    #            map->odom identity, map frozen at 81x66 / 234 occupied cells
    #   0.005 -> 81 scans processed, graph 85 markers, map->odom live,
    #            map grew to 106x81 / 547 occupied cells
    #
    # 0.05 rather than the 0.005 used for the test: 0.005 also adds nodes very
    # aggressively while DRIVING, which inflates the graph and the loop-closure
    # search for no benefit. 0.05 is small enough that ordinary rotation-heavy
    # manoeuvring keeps feeding the mapper.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation / scan matcher 
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
