### slam_toolbox (online async): LiDAR mapping, publishes map -> odom
#
# Consumes /scan (Hokuyo UST-10LX, frame 'laser') and the EKF's odom -> base_link,
# and produces the map plus the map -> odom correction. This is how the LiDAR
# enters the fusion (REP-105: SLAM owns map -> odom; EKF owns odom -> base_link).

slam_toolbox:
  ros__parameters:
    # Pose-graph solver. All five ceres_* values are the slam_toolbox defaults;
    # the graph is small enough that none of them has been worth retuning.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY  # sparse Cholesky on the normal equations
    ceres_preconditioner: SCHUR_JACOBI           # preconditioner for the linear solve
    ceres_trust_strategy: LEVENBERG_MARQUARDT    # trust-region step strategy
    ceres_dogleg_type: TRADITIONAL_DOGLEG        # only used if the strategy is DOGLEG
    ceres_loss_function: None                    # no robust kernel on graph residuals

    # Frames / topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan             # must match urg_node2's remapped output
    mode: mapping                 # 'mapping' to build a map; 'localization' to reuse one

    # Rates / TF
    transform_publish_period: 0.02  # s, map -> odom broadcast period (50 Hz)
    map_update_interval: 2.0        # s, between /map republishes
    transform_timeout: 0.5          # s, wait for odom -> base_link before dropping a scan
    scan_queue_size: 20             # scans buffered while the mapper is busy
    tf_buffer_duration: 10.0        # s of TF history retained for lookups
    use_scan_matching: true         # refine each scan against the graph; false = odom only
    use_scan_barycenter: true       # measure travel from the scan centroid, not the sensor origin

    # Hokuyo UST-10LX: ~270 deg FOV, 10 m range
    max_laser_range: 10.0         # m, matches amcl.yaml's laser_max_range
    minimum_time_interval: 0.2    # s, floor on the gap between processed scans
    resolution: 0.05              # m/cell of the published occupancy grid

    # This value is load-bearing. At the slam_toolbox default of 0.2 this node
    # processes ZERO scans during in-place rotation and the map silently stops
    # updating.
    #
    # slam_toolbox's own pre-filter (shouldProcessScan) gates on TRANSLATION
    # only. minimum_travel_heading below is consulted by the karto mapper, which
    # sits DOWNSTREAM of that gate -- so a scan taken while the rover spins on
    # the spot is discarded before anything ever looks at the heading. Rotating
    # in place produces no translation, so no scan is ever processed.
    #
    # This is invisible from outside: the node stays lifecycle-'active',
    # answers parameter queries, keeps publishing /map on its map_update_interval
    # timer and map->odom on its transform_publish_period timer, and logs
    # nothing. What gives it away is that map->odom is bit-exactly identity and
    # /pose never publishes.
    #
    # Measured A/B, same rover, same in-place spin (odom translation stayed
    # under 3.5 cm throughout):
    #   0.2   -> 0 scans processed over ~1443 deg, graph 1 node / 0 edges,
    #            map->odom identity, map frozen at 81x66 / 234 occupied cells
    #   0.005 -> 81 scans processed, graph 85 markers, map->odom live,
    #            map grew to 106x81 / 547 occupied cells
    #
    # 0.05 rather than the 0.005 used for the test: 0.005 also adds nodes very
    # aggressively while DRIVING, which inflates the graph and the loop-closure
    # search for no benefit. 0.05 is small enough that ordinary rotation-heavy
    # manoeuvring keeps feeding the mapper.
    minimum_travel_distance: 0.05  # m of translation before a scan is processed
    minimum_travel_heading: 0.2    # rad of rotation before the mapper adds a node
    scan_buffer_size: 10           # running scans kept for local matching
    scan_buffer_maximum_scan_distance: 10.0  # m, span that buffer may cover

    # Loop closure. The two response values are normalised match scores in
    # [0, 1]; a candidate must clear coarse before the fine search runs.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0        # m, radius searched for loop candidates
    loop_match_minimum_chain_size: 10        # nodes a candidate chain must contain
    loop_match_minimum_response_coarse: 0.35 # score to accept the coarse match
    loop_match_minimum_response_fine: 0.45   # score to accept the refined match

    # Correlation scan matcher. It brute-forces a grid of candidate poses around
    # the odometry prediction, so the search window and its resolution set both
    # the accuracy and the cost. The penalties bias the winner back toward the
    # prediction, and the floors keep that bias from ever reaching zero.
    correlation_search_space_dimension: 0.5        # m, side of the square search window
    correlation_search_space_resolution: 0.01      # m, translation step within it
    correlation_search_space_smear_deviation: 0.1  # m, blur applied to the lookup grid
    distance_variance_penalty: 0.5   # variance penalising translation away from the prediction
    angle_variance_penalty: 1.0      # variance penalising rotation away from the prediction
    fine_search_angle_offset: 0.00349   # rad, angular step of the fine search (0.2 deg)
    coarse_search_angle_offset: 0.349   # rad, half-width of the coarse sweep (20 deg)
    coarse_angle_resolution: 0.0349     # rad, angular step of that sweep (2 deg)
    minimum_angle_penalty: 0.9       # floor on the angle penalty multiplier
    minimum_distance_penalty: 0.5    # floor on the distance penalty multiplier
    use_response_expansion: true     # widen the search when no candidate scores well
