### PPO hyperparameters for point-goal navigation.
#
# Consumes: envs/rover_env.py and envs/scenarios.py
# Produces: runs/<name>/ holding checkpoints, the best model, and tensorboard
#
# Defaults are a sane starting point, not a tuned set. The reward weights in
# envs/reward.py are the thing to iterate on first; hyperparameters matter
# less than shaping on a task this simple.

run:
  name: "rover_ppo"          # run folder under runs/; a timestamp is appended
  total_timesteps: 5000000   # control steps; ~64 min per 5 M at 1,312 fps
  seed: 0                    # seeds env, policy init and action sampling
  n_envs: 12                 # SubprocVecEnv workers; matches the Orin's cores
  # A name from envs/scenarios.SUITE, or a path to a saved slam_toolbox
  # map .yaml. NOT a saved map for from-scratch training: the lab map has a
  # median clearance of 0.32 m against a rover of 0.269 m radius, a quarter
  # of its free space is narrower than the rover, and its most open point is
  # 1.27 m. Random exploration collides within seconds there, so the policy
  # never survives long enough to discover that reaching goals pays. Train
  # here, evaluate on a map.
  scenario: "sparse"
  # GPU, despite the policy being two 256-unit layers. Measured end to end on
  # this Orin: 552 fps on cpu against 1,182 on cuda. The usual advice to keep
  # a small MLP on the CPU assumes a discrete card across PCIe; here the
  # memory is unified, so the copy is nearly free and 12 weak Cortex-A78AE
  # cores lose to the iGPU on batched matmuls. Nothing else contends for the
  # GPU during offline training.
  device: "cuda"

eval:
  every: 100000              # control steps between evaluations
  # 20 episodes every 50 k was costing about 28% of total compute, since
  # eval runs single-threaded and episodes reach ~1,100 steps.
  episodes: 10
  # DELIBERATELY NOT the training scenario. Evaluating on a layout the
  # policy never trains on is the only way to see memorisation happen: if
  # training reward climbs while this stays flat, the policy is learning one
  # furniture arrangement rather than how to drive.
  scenario: "cluttered"

checkpoint:
  every: 250000              # control steps between saved checkpoints

env:
  decimation: 12             # physics steps per control step -> 48 ms, ~20 Hz
  lidar_beams: 60            # downsampled from the UST-10LX's ~1081
  mass_randomisation: 0.3    # fraction, +-30% on body mass each reset

ppo:
  # Rollout length PER ENV. 512 x 12 envs is a 6144-step batch, which is
  # several episodes' worth and keeps the advantage estimate stable.
  n_steps: 512
  # Minibatch size. Gradient updates, not physics, set the training rate, so
  # this is the strongest speed knob: 512 gives 1,182 fps, 1024 gives 1,312
  # and 2048 gives 1,500. 1024 is the stopping point because it still leaves
  # 6 minibatches per epoch, where 2048 leaves only 3 and buys its extra
  # speed by doing fewer updates per sample.
  batch_size: 1024
  n_epochs: 10               # passes over each rollout
  learning_rate: 0.0003      # Adam step size
  gamma: 0.99                # discount; ~100-step horizon at 48 ms is ~4.8 s
  gae_lambda: 0.95           # advantage smoothing
  clip_range: 0.2            # PPO trust region on the policy ratio
  # Zero, which is SB3's default. At 0.005 and with a flat reward landscape
  # there was nothing opposing the bonus, so action noise grew from std 1.0
  # to 4.7 over 3.5 M steps and the policy ended noisier than it began.
  ent_coef: 0.0
  vf_coef: 0.5               # value loss weight
  max_grad_norm: 0.5         # gradient clipping
  net_arch: [256, 256]       # hidden layers, shared by policy and value
