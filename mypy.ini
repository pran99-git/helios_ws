[mypy]
# Vendor submodules are upstream code we do not edit or type-check.
# setup.py is packaging boilerplate, and every package has one, so they
# collide as duplicate top-level modules and abort the whole run.
exclude = (?x)(
    ^src/vla_pkg/omnivla/
  | ^src/perception_pkg/camera/zed-ros2-wrapper/
  | ^src/perception_pkg/lidar/urg_node2/
  | /build/
  | /install/
  | \.egg-info/
  | /setup\.py$
  | /conftest\.py$
  )
ignore_missing_imports = True

# ROS 2's `launch` package builds its public names dynamically, so mypy sees
# no LaunchDescription/LaunchContext attribute and every launch file trips
# attr-defined. Treat the module as untyped rather than edit launch files to
# work around a stub gap.
[mypy-launch]
follow_imports = skip
